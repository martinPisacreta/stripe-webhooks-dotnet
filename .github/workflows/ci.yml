name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # The projects target net10.0 and net8.0. The .NET 10 SDK builds both (global.json asks for
      # 10.0.100 or later); the .NET 8 SDK is installed for its runtime, so the net8.0 tests run on
      # .NET 8 itself instead of rolling forward.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      # GitHub Actions sets CI=true, which turns warnings into errors (Directory.Build.props).
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"
